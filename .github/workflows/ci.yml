name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/settings/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2

      - name: Check WinGet automation without network or credentials
        shell: pwsh
        run: ./scripts/Test-WingetAutomation.ps1

      - name: Check code-signing policy without network, credentials or trust changes
        shell: pwsh
        run: ./scripts/Test-CodeSigning.ps1

      - name: Check release antivirus verification without malware or Defender changes
        shell: pwsh
        run: ./scripts/Test-ReleaseAntivirus.ps1

      # The settings app embeds its built front end at compile time.
      - name: Build settings UI
        working-directory: apps/settings
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - run: cargo fmt --all --check
      - name: Run Windows Clippy
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cargo clippy --color never --workspace --all-targets -- -D warnings 2>&1 |
            Tee-Object -Variable clippyLog
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $detail = ($clippyLog | Select-Object -Last 20) -join "`n"
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows Clippy::$detail"
            exit $exitCode
          }
      - run: cargo test --workspace
