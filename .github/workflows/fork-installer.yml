name: Fork installer

# Unsigned installer for this fork. The official Release workflow needs
# SignPath and the minisign private key, which are not in this repository.
# Pushing main builds Nikao-Dock-Setup.exe, keeps it as an artifact, and
# publishes GLASS_TAG if that pre-release does not exist yet. Running this
# by hand (workflow_dispatch) always replaces GLASS_TAG. No updater manifest
# is uploaded.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-installer
  cancel-in-progress: true

env:
  GLASS_TAG: v0.1.22-glass.7

jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  installer:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/settings/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2

      - name: Install settings dependencies
        working-directory: apps/settings
        run: pnpm install --frozen-lockfile

      - name: Build the unsigned installer
        env:
          # Read by muelle-shell at compile time. Official CI does not set it.
          MUELLE_FORK_BUILD: "1"
        run: ./scripts/build-installer.ps1

      - name: Reject a build that can still update from upstream
        run: |
          $settings = 'target/release/muelle-settings.exe'
          $bytes = [IO.File]::ReadAllBytes($settings)
          $ascii = [Text.Encoding]::ASCII.GetString($bytes)
          $utf16 = [Text.Encoding]::Unicode.GetString($bytes)
          $upstream = 'crafter-station/Muelle/releases/latest/download/latest.json'
          $fork = 'jhosepqr/Nikao-Dock/releases/download/v0.1.22-glass.7/latest.json'
          if ($ascii.Contains($upstream) -or $utf16.Contains($upstream)) {
            throw 'muelle-settings.exe still contains the upstream updater endpoint'
          }
          if (-not ($ascii.Contains($fork) -or $utf16.Contains($fork))) {
            throw 'muelle-settings.exe is missing the fork updater endpoint'
          }

      - name: Collect Nikao-Dock-Setup.exe
        run: |
          $found = @(Get-ChildItem -LiteralPath 'target/release/bundle/nsis' -Filter '*_x64-setup.exe' |
            Where-Object { $_.Name -like 'Nikao Dock_*' })
          if ($found.Count -ne 1) { throw "expected one Nikao Dock installer, found $($found.Count)" }
          New-Item -ItemType Directory -Force upload | Out-Null
          Copy-Item -LiteralPath $found[0].FullName upload/Nikao-Dock-Setup.exe

      - name: Upload the installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: Nikao-Dock-Setup
          path: upload/Nikao-Dock-Setup.exe
          if-no-files-found: error
          retention-days: 90

      - name: Update Defender definitions for release analysis
        timeout-minutes: 5
        run: Update-MpSignature -ErrorAction Stop

      - name: Analyze the final release files with Microsoft Defender
        timeout-minutes: 10
        run: |
          ./scripts/Assert-ReleaseAntivirus.ps1 -ReportDirectory antivirus-report -Path `
            target/release/muelle-settings.exe,apps/settings/src-tauri/binaries/muelle-x86_64-pc-windows-msvc.exe,upload/Nikao-Dock-Setup.exe

      - name: Keep antivirus verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: antivirus-glass
          path: antivirus-report/
          if-no-files-found: warn
          retention-days: 14

      # Publishes a new GLASS_TAG once on push to main, or replaces an
      # existing pre-release when run manually via workflow_dispatch.
      - name: Publish the pre-release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:GLASS_TAG --repo $env:GITHUB_REPOSITORY | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          if ($exists -and '${{ github.event_name }}' -ne 'workflow_dispatch') {
            Write-Host "$env:GLASS_TAG already published; skipping publish on push."
            exit 0
          }
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GLASS_TAG/Nikao-Dock-Setup.exe"
          @(
            'Instalador sin firmar de main. Arregla la búsqueda: ahora se puede escribir, se ven el texto, el cursor y el texto de ayuda, Enter abre el primer resultado y Esc cierra. Busca apps del menú Inicio y páginas de Configuración; la última fila busca archivos con el índice de Windows en el Explorador. Mantiene el estilo Liquid Glass claro. Cerrado, el panel no usa CPU.'
            ''
            'No se actualiza solo al Muelle oficial de crafter-station. La próxima compilación se instala a mano. No incluye latest.json.'
            ''
            'Es otra aplicación que la entrada "Muelle". El instalador apaga el inicio automático de Muelle, cierra ese dock y lo desinstala en silencio sin borrar %APPDATA%\Muelle. Al abrir Nikao Dock, copia pines y ajustes a %APPDATA%\Nikao Dock.'
            '1. Cerrá el dock si está abierto.'
            '2. Descargá Nikao-Dock-Setup.exe. Si Edge avisa que no es habitual, abrí los puntos y elegí Conservar.'
            '3. Al abrirlo, si Windows dice que protegió tu PC: Más información > Ejecutar de todas formas.'
            '4. La instalación no tiene asistente. Queda en %LOCALAPPDATA%\Programs\Nikao Dock y abre el dock. El inicio con Windows queda prendido; se apaga en Ajustes.'
            '5. Si en Configuración > Aplicaciones sigue apareciendo "Muelle", desinstalalo sin marcar borrar datos. Tiene que quedar solo Nikao Dock.'
            ''
            $url
          ) | Set-Content -Encoding utf8NoBOM notes.md

          if ($exists) {
            gh release delete $env:GLASS_TAG --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
            if ($LASTEXITCODE) { throw "no se pudo reemplazar $env:GLASS_TAG" }
          }
          gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$env:GLASS_TAG"
          gh release create $env:GLASS_TAG upload/Nikao-Dock-Setup.exe `
            --repo $env:GITHUB_REPOSITORY `
            --prerelease `
            --title "Nikao Dock $env:GLASS_TAG" `
            --notes-file notes.md
          if ($LASTEXITCODE) { throw 'gh release create failed' }
          $url >> $env:GITHUB_STEP_SUMMARY
